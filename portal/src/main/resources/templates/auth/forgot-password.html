<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments/layout :: head('Reset your password')}"></head>
<body>
<div class="auth-wrap">
    <div class="auth-card">
        <div class="auth-brand">
            <div class="brand-mark">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M3 21V5l9-3v3h9v16H3Zm2-2h5v-2H5v2Zm0-4h5v-2H5v2Zm0-4h5V9H5v2Zm7 8h5v-2h-5v2Zm0-4h5v-2h-5v2Zm0-4h5V9h-5v2Zm7 8h2V7h-2v12Z"/></svg>
            </div>
            <div>
                <div class="brand-name">Northbridge</div>
                <div class="brand-sub">Corporate Payments</div>
            </div>
        </div>

        <h1 class="auth-title">Reset your password</h1>
        <p class="auth-sub">Enter your work email and we'll send you a single-use link to choose a new password.</p>

        <div th:if="${success != null}" class="alert success">
            <svg class="alert-icon" width="18" height="18"><use href="#icon-check"/></svg>
            <span th:text="${success}">Done.</span>
        </div>
        <div th:if="${error != null}" class="alert danger">
            <svg class="alert-icon" width="18" height="18"><use href="#icon-warning"/></svg>
            <span th:text="${error}">Error.</span>
        </div>

        <form th:action="@{/forgot-password}" method="post">
            <div class="field">
                <label for="email">Work email</label>
                <input type="email" id="email" name="email" autocomplete="username"
                       placeholder="you@company.example" required autofocus>
            </div>
            <button class="btn btn-primary btn-block btn-lg" type="submit">Send reset link</button>
        </form>

        <div class="auth-foot">
            Remembered it? <a href="/login" th:href="@{/login}">Back to sign in</a>
        </div>
    </div>
</div>
<svg xmlns="http://www.w3.org/2000/svg" style="display:none">
    <symbol id="icon-info" viewBox="0 0 24 24"><path fill="currentColor" d="M11 7h2v2h-2V7Zm0 4h2v6h-2v-6Zm1-9a10 10 0 1 1 0 20 10 10 0 0 1 0-20Zm0 2a8 8 0 1 0 0 16 8 8 0 0 0 0-16Z"/></symbol>
    <symbol id="icon-warning" viewBox="0 0 24 24"><path fill="currentColor" d="M12 2 1 21h22L12 2Zm0 4.2L19.5 19h-15L12 6.2ZM11 10h2v5h-2v-5Zm0 7h2v2h-2v-2Z"/></symbol>
    <symbol id="icon-check" viewBox="0 0 24 24"><path fill="currentColor" d="m9.5 16.2-4.3-4.3 1.4-1.4 2.9 2.9 8.3-8.3 1.4 1.4-9.7 9.7Z"/></symbol>
</svg>
</body>
</html>
