# Test profile: embedded H2 (PostgreSQL compatibility mode), no Flyway,
# schema generated by Hibernate and dropped after the context shuts down.
spring:
  datasource:
    url: jdbc:h2:mem:coremock;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: create-drop
  flyway:
    enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health

# Fixed test credentials — never used outside the test classpath.
app:
  env:
    core-api-key: test-core-api-key-0123456789
    core-scope-secret: test-scope-secret-0123456789abcdef
