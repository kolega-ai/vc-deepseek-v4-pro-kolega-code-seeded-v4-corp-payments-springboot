server:
  port: ${SERVER_PORT:8082}

spring:
  application:
    name: core-mock
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/core_mock}
    username: ${SPRING_DATASOURCE_USERNAME:core_mock}
    # Local development default only; every environment must override via
    # SPRING_DATASOURCE_PASSWORD. Documented as a dev value in README.md.
    password: ${SPRING_DATASOURCE_PASSWORD:coremock_dev_password}
  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns the schema; Hibernate must not generate or alter DDL.
      ddl-auto: none
  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

# Core-banking credentials. No defaults exist: startup fails fast with a clear
# message when either variable is blank (see config/AppEnvProperties).
app:
  env:
    core-api-key: ${CORE_MOCK_API_KEY:}
    core-scope-secret: ${CORE_SCOPE_SECRET:}

logging:
  level:
    com.northbridge.coremock: INFO
