name: corp-payments

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-corpadmin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-corp_dev_pg_password}
      PORTAL_DB_USER: ${PORTAL_DB_USER:-portal}
      PORTAL_DB_PASSWORD: ${PORTAL_DB_PASSWORD:-portal_dev_password}
      PAYMENT_API_DB_USER: ${PAYMENT_API_DB_USER:-payment_api}
      PAYMENT_API_DB_PASSWORD: ${PAYMENT_API_DB_PASSWORD:-paymentapi_dev_password}
      CORE_MOCK_DB_USER: ${CORE_MOCK_DB_USER:-core_mock}
      CORE_MOCK_DB_PASSWORD: ${CORE_MOCK_DB_PASSWORD:-coremock_dev_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-corpadmin} -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 20

  core-mock:
    build:
      context: .
      dockerfile: docker/core-mock.Dockerfile
    environment:
      CORE_MOCK_API_KEY: ${CORE_MOCK_API_KEY:?Set CORE_MOCK_API_KEY in .env (run scripts/setup-env.sh)}
      CORE_SCOPE_SECRET: ${CORE_SCOPE_SECRET}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/core_mock
      SPRING_DATASOURCE_USERNAME: ${CORE_MOCK_DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${CORE_MOCK_DB_PASSWORD}
      SERVER_PORT: "8082"
    ports:
      - "${CORE_MOCK_PORT:-8082}:8082"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8082/actuator/health | grep -q UP || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 40s

  payment-api:
    build:
      context: .
      dockerfile: docker/payment-api.Dockerfile
    environment:
      TIER_TOKEN_SECRET: ${TIER_TOKEN_SECRET}
      CORE_SCOPE_SECRET: ${CORE_SCOPE_SECRET}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN}
      CORE_MOCK_API_KEY: ${CORE_MOCK_API_KEY:?Set CORE_MOCK_API_KEY in .env (run scripts/setup-env.sh)}
      CORE_MOCK_BASE_URL: http://core-mock:8082
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/payment_api
      SPRING_DATASOURCE_USERNAME: ${PAYMENT_API_DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${PAYMENT_API_DB_PASSWORD}
      SERVER_PORT: "8081"
    ports:
      - "${PAYMENT_API_PORT:-8081}:8081"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/actuator/health | grep -q UP || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 60s

  portal:
    build:
      context: .
      dockerfile: docker/portal.Dockerfile
    environment:
      TIER_TOKEN_SECRET: ${TIER_TOKEN_SECRET}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN}
      PAYMENT_API_BASE_URL: http://payment-api:8081
      PORTAL_UPLOAD_DIR: ${PORTAL_UPLOAD_DIR:-/data/uploads}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/portal
      SPRING_DATASOURCE_USERNAME: ${PORTAL_DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${PORTAL_DB_PASSWORD}
      SERVER_PORT: "8080"
    ports:
      - "${PORTAL_PORT:-8080}:8080"
    volumes:
      - portal-uploads:${PORTAL_UPLOAD_DIR:-/data/uploads}
    depends_on:
      payment-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q UP || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 60s

  batch:
    build:
      context: .
      dockerfile: docker/batch.Dockerfile
    environment:
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN}
      PAYMENT_API_BASE_URL: http://payment-api:8081
      CORE_MOCK_BASE_URL: http://core-mock:8082
      CORE_MOCK_API_KEY: ${CORE_MOCK_API_KEY:?Set CORE_MOCK_API_KEY in .env (run scripts/setup-env.sh)}
      CORE_SCOPE_SECRET: ${CORE_SCOPE_SECRET}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/payment_api
      SPRING_DATASOURCE_USERNAME: ${PAYMENT_API_DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${PAYMENT_API_DB_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
      payment-api:
        condition: service_healthy

volumes:
  pgdata:
  portal-uploads:
